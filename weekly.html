<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Weekly Price Movement Tracker</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div id="siteMenu"></div>
    <div class="container">
        <h1>📈 Stock Weekly Price Movement Tracker</h1>
        <p class="subtitle">Weekly percentage changes for all NIFTY 100 stocks across recent weeks.</p>

        <div class="controls">
            <div class="control-group" style="flex: 0 0 170px;">
                <label for="startDate">Start Date</label>
                <input type="date" id="startDate" min="2018-01-01" />
            </div>
            <div class="control-group" style="flex: 0 0 170px;">
                <label for="endDate">End Date</label>
                <input type="date" id="endDate" />
            </div>
            <div class="control-group" style="flex: 0 0 120px; align-self: flex-end;">
                <label>&nbsp;</label>
                <button onclick="fetchAllStocksData()">Load Data</button>
            </div>
        </div>

        <div class="error" id="errorMsg"></div>
        <div class="loading" id="loading">⏳ Fetching data for all stocks... This may take a moment.</div>

        <div class="table-wrapper" id="tableWrapper" style="display: none;">
            <table id="weeklyTable">
                <thead id="tableHead">
                    <tr>
                        <th>Stock</th>
                        <!-- Week headers will be added dynamically -->
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/menu.js"></script>
    <script>
        // Weekly-specific variables and functions
        let allStocksWeeklyData = {};
        let allWeeks = [];
        let weeklySortState = {
            column: 'marketCap',
            direction: 'asc'
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setDefaultDateRange();
            fetchAllStocksData(); // Auto-load last 20 weeks data
        });

        function setDefaultDateRange() {
            const startDateInput = document.getElementById('startDate');
            const endDateInput = document.getElementById('endDate');

            // Calculate date 26 weeks ago for the weekly chart range
            const endDate = new Date();
            const startDate = new Date();
            startDate.setDate(endDate.getDate() - (26 * 7)); // 26 weeks * 7 days

            startDateInput.value = formatDate(startDate);
            endDateInput.value = formatDate(endDate);
            endDateInput.max = formatDate(endDate);
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function fetchAllStocksData() {
            const startDateInput = document.getElementById('startDate').value;
            const endDateInput = document.getElementById('endDate').value;
            if (!startDateInput || !endDateInput) {
                showError('Please select both start and end dates');
                return;
            }

            const startDate = new Date(startDateInput);
            const endDate = new Date(endDateInput);
            if (startDate > endDate) {
                showError('Start date must be on or before end date');
                return;
            }

            showLoading(true);
            showError('');
            allStocksWeeklyData = {};
            allWeeks = [];

            try {
                // Fetch data for all stocks
                const fetchPromises = NIFTY_100_STOCKS.map(async (stock) => {
                    try {
                        const startTimeInMillis = convertDateToISTTimestamp(startDateInput);
                        const endTimeInMillis = convertDateToISTTimestamp(endDateInput);
                        const candles = await fetchCandles(stock, startTimeInMillis, endTimeInMillis);
                        return { stock, candles };
                    } catch (error) {
                        console.warn(`Failed to fetch data for ${stock}:`, error);
                        return null;
                    }
                });

                const results = await Promise.all(fetchPromises);
                const validResults = results.filter(result => result !== null);

                // Process all stock data
                processAllStocksData(validResults);
                showLoading(false);
            } catch (error) {
                showLoading(false);
                showError(`Error fetching data: ${error.message}`);
            }
        }

        function processAllStocksData(stockResults) {
            // Generate consecutive 26-week range starting from the most recent week
            const endDate = new Date();
            const startDate = new Date();
            startDate.setDate(endDate.getDate() - (26 * 7)); // 26 weeks ago

            // Generate all weeks in the range
            allWeeks = [];
            const currentWeek = new Date(startDate);
            currentWeek.setDate(currentWeek.getDate() - currentWeek.getDay() + 1); // Start from Monday

            while (currentWeek <= endDate) {
                // Create week key as YYYY-MM-DD format for Monday of the week
                const year = currentWeek.getFullYear();
                const month = String(currentWeek.getMonth() + 1).padStart(2, '0');
                const day = String(currentWeek.getDate()).padStart(2, '0');
                const weekKey = `${year}-${month}-${day}`;
                allWeeks.push(weekKey);
                currentWeek.setDate(currentWeek.getDate() + 7); // Next week
            }

            // Process each stock's data
            stockResults.forEach(({ stock, candles }) => {
                const weeklyDataMap = {};

                // Group candles by week
                candles.forEach(candle => {
                    let timestamp = candle[0];
                    if (timestamp < 10000000000) {
                        timestamp = timestamp * 1000;
                    }
                    const date = convertISTTimestampToDate(timestamp);
                    const weekStart = new Date(date);
                    weekStart.setDate(date.getDate() - date.getDay() + 1);
                    // Create week key as YYYY-MM-DD format for Monday of the week
                    const year = weekStart.getFullYear();
                    const month = String(weekStart.getMonth() + 1).padStart(2, '0');
                    const day = String(weekStart.getDate()).padStart(2, '0');
                    const weekKey = `${year}-${month}-${day}`;

                    if (!weeklyDataMap[weekKey]) {
                        weeklyDataMap[weekKey] = {
                            open: candle[1],
                            close: candle[4],
                            high: candle[2],
                            low: candle[3],
                            volume: candle[5] || 0,
                            candles: []
                        };
                    } else {
                        weeklyDataMap[weekKey].close = candle[4];
                        weeklyDataMap[weekKey].high = Math.max(weeklyDataMap[weekKey].high, candle[2]);
                        weeklyDataMap[weekKey].low = Math.min(weeklyDataMap[weekKey].low, candle[3]);
                        weeklyDataMap[weekKey].volume += candle[5] || 0;
                    }
                    weeklyDataMap[weekKey].candles.push(candle);
                });

                // Calculate price changes for this stock
                const stockWeeklyChanges = {};
                allWeeks.forEach(weekKey => {
                    if (weeklyDataMap[weekKey]) {
                        const data = weeklyDataMap[weekKey];
                        const priceChange = ((data.close - data.open) / data.open) * 100;
                        stockWeeklyChanges[weekKey] = {
                            priceChange,
                            data
                        };
                    }
                });

                allStocksWeeklyData[stock] = stockWeeklyChanges;
            });

            // Build the grid table
            buildWeeklyGridTable();
        }

        function buildWeeklyGridTable() {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');

            // Clear existing content
            thead.innerHTML = '';
            tbody.innerHTML = '';

            // Build header row with weeks
            const headerRow = document.createElement('tr');
            headerRow.appendChild(createWeeklySortableHeader('Stock', 'stock', 'stock-col'));

            // Show only the most recent 10 weeks in the grid,
            // while the graph still uses the full 26-week dataset.
            const visibleWeeks = allWeeks.slice(-10);
            visibleWeeks.forEach(weekKey => {
                const weekHeader = createWeeklySortableHeader('', weekKey, 'week-header');
                // Format week key (YYYY-MM-DD) to show week range
                const monday = new Date(`${weekKey}T00:00:00`);
                const sunday = new Date(monday);
                sunday.setDate(monday.getDate() + 6);
                const monMonth = monday.toLocaleString('default', { month: 'short' });
                const monDay = monday.getDate();
                const sunMonth = sunday.toLocaleString('default', { month: 'short' });
                const sunDay = sunday.getDate();
                weekHeader.querySelector('.header-label').textContent = `${monMonth} ${monDay}-${sunDay}`;
                headerRow.appendChild(weekHeader);
            });
            thead.appendChild(headerRow);

            // Sort stocks by market cap
            const sortedStocks = getSortedWeeklyStocks(visibleWeeks);

            // Build rows for each stock
            sortedStocks.forEach(stock => {
                const row = document.createElement('tr');
                const stockCell = document.createElement('td');
                stockCell.className = 'stock-col';
                stockCell.textContent = stock;
                stockCell.style.cursor = 'pointer';
                stockCell.title = 'Click to open Sensibull chart';
                stockCell.onclick = () => openSensibullChart(stock);
                row.appendChild(stockCell);

                visibleWeeks.forEach(weekKey => {
                    const cell = document.createElement('td');
                    cell.className = 'month-cell';

                    const weekData = allStocksWeeklyData[stock][weekKey];
                    if (weekData) {
                        const change = weekData.priceChange;
                        cell.textContent = change.toFixed(1);
                        // Format week key for readable tooltip
                        const monday = new Date(weekKey);
                        const sunday = new Date(monday);
                        sunday.setDate(monday.getDate() + 6);
                        const monMonth = monday.toLocaleString('default', { month: 'short' });
                        const monDay = monday.getDate();
                        const sunMonth = sunday.toLocaleString('default', { month: 'short' });
                        const sunDay = sunday.getDate();
                        cell.setAttribute('title', `${stock} - Week of ${monMonth} ${monDay}-${sunDay}: ${change.toFixed(2)}%`);
                        cell.style.backgroundColor = getColor(change);
                        cell.style.color = getTextColor(change);
                    } else {
                        cell.className = 'month-cell neutral';
                        cell.textContent = 'N/A';
                        cell.style.backgroundColor = '#f0f0f0';
                        cell.style.color = '#999';
                    }

                    row.appendChild(cell);
                });

                tbody.appendChild(row);
            });

            document.getElementById('tableWrapper').style.display = 'block';
        }

        function createWeeklySortableHeader(label, sortKey, className) {
            const header = document.createElement('th');
            header.className = `${className} sortable-header`;
            header.dataset.sortKey = sortKey;
            header.innerHTML = '<span class="header-label"></span><span class="sort-indicator"></span>';
            header.querySelector('.header-label').textContent = label;
            header.title = 'Click to sort';
            header.style.cursor = 'pointer';
            header.addEventListener('click', () => handleWeeklySort(sortKey));
            updateWeeklyHeaderIndicator(header, sortKey);
            return header;
        }

        function handleWeeklySort(sortKey) {
            if (weeklySortState.column === sortKey) {
                weeklySortState.direction = weeklySortState.direction === 'asc' ? 'desc' : 'asc';
            } else {
                weeklySortState.column = sortKey;
                weeklySortState.direction = 'asc';
            }

            buildWeeklyGridTable();
        }

        function getSortedWeeklyStocks(visibleWeeks) {
            const stocks = Object.keys(allStocksWeeklyData);

            if (weeklySortState.column === 'marketCap') {
                return stocks.sort((a, b) => {
                    const rankA = MARKET_CAP_RANK[a] ?? Number.MAX_SAFE_INTEGER;
                    const rankB = MARKET_CAP_RANK[b] ?? Number.MAX_SAFE_INTEGER;
                    return rankA - rankB || a.localeCompare(b);
                });
            }

            if (weeklySortState.column === 'stock') {
                const direction = weeklySortState.direction === 'desc' ? -1 : 1;
                return stocks.sort((a, b) => direction * a.localeCompare(b));
            }

            if (!visibleWeeks.includes(weeklySortState.column)) {
                return stocks.sort((a, b) => {
                    const rankA = MARKET_CAP_RANK[a] ?? Number.MAX_SAFE_INTEGER;
                    const rankB = MARKET_CAP_RANK[b] ?? Number.MAX_SAFE_INTEGER;
                    return rankA - rankB || a.localeCompare(b);
                });
            }

            const direction = weeklySortState.direction === 'desc' ? -1 : 1;
            return stocks.sort((a, b) => {
                const valueA = allStocksWeeklyData[a][weeklySortState.column]?.priceChange ?? null;
                const valueB = allStocksWeeklyData[b][weeklySortState.column]?.priceChange ?? null;

                if (valueA === null && valueB === null) {
                    return a.localeCompare(b);
                }

                if (valueA === null) {
                    return 1;
                }

                if (valueB === null) {
                    return -1;
                }

                const delta = valueA - valueB;
                if (delta === 0) {
                    return a.localeCompare(b);
                }

                return direction * delta;
            });
        }

        function updateWeeklyHeaderIndicator(header, sortKey) {
            const indicator = header.querySelector('.sort-indicator');
            if (!indicator) {
                return;
            }

            if (weeklySortState.column === sortKey && sortKey !== 'marketCap') {
                indicator.textContent = weeklySortState.direction === 'asc' ? '▲' : '▼';
            } else {
                indicator.textContent = '';
            }
        }

    </script>
</body>
</html>
