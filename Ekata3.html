<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>यशराज एकता पॅनल</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  font-family: 'Segoe UI', Arial, sans-serif;
}

#app {
  width:480px;
  height:854px;
  background:#1a0000;
  position:relative;
  overflow:hidden;
  border-radius:16px;
  box-shadow:0 0 60px rgba(212,175,55,0.4);
}

/* Progress */
#prog {
  position:absolute;
  bottom:0; left:0;
  height:6px;
  background:linear-gradient(90deg,#D4AF37,#FF6B35);
  z-index:100;
  transition:width 0.2s linear;
  width:0%;
}

/* Slides container */
#slides { width:100%; height:100%; position:relative; }

.slide {
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:30px 24px;
  text-align:center;
}
.slide.show { display:flex; }

/* ---- SLIDE 0: Opening ---- */
.s0 { background:radial-gradient(ellipse at 50% 30%, #3d0a00 0%, #0d0000 70%); }
.s0-top { font-size:14px; color:#D4AF37; letter-spacing:2px; margin-bottom:12px; line-height:1.5; }
.s0-cup { font-size:90px; margin:10px 0; filter:drop-shadow(0 0 20px #D4AF37); animation:pulse 2s infinite; }
.s0-title { font-size:36px; font-weight:900; color:#FFD700; text-shadow:0 0 20px #D4AF37; margin:8px 0; }
.s0-sub { font-size:18px; color:#FFD700; margin:4px 0; }
.s0-line { width:280px; height:2px; background:linear-gradient(90deg,transparent,#D4AF37,transparent); margin:16px auto; }
.s0-tagline { font-size:16px; color:#f5dfa0; font-style:italic; margin:8px 0; }
.s0-box { background:rgba(139,0,0,0.7); border:2px solid #D4AF37; border-radius:30px; padding:14px 28px; margin-top:16px; }
.s0-date { font-size:22px; font-weight:700; color:#fff; }
.s0-time { font-size:16px; color:#D4AF37; margin-top:4px; }
.s0-sym { font-size:15px; color:#D4AF37; margin-top:14px; letter-spacing:2px; }

/* ---- CATEGORY DIVIDER ---- */
.cat-div {
  background:linear-gradient(135deg,#5C0000 0%,#8B0000 50%,#5C0000 100%);
}
.cat-div-icon { font-size:64px; margin-bottom:12px; }
.cat-div-title { font-size:34px; font-weight:900; color:#FFD700; margin:8px 0; text-shadow:0 0 15px #D4AF37; }
.cat-div-sub { font-size:18px; color:#f5dfa0; }
.cat-line { width:300px; height:2px; background:linear-gradient(90deg,transparent,#D4AF37,transparent); margin:16px auto; }

/* ---- CANDIDATE SLIDE ---- */
.cand-slide { background:linear-gradient(160deg,#0d0000 0%,#200500 50%,#0d0000 100%); padding-top:10px; }

.cand-topbar {
  position:absolute; top:0; left:0; right:0;
  padding:12px 20px;
  background:linear-gradient(90deg,#5C0000,#8B0000,#5C0000);
  border-bottom:2px solid #D4AF37;
  font-size:15px; color:#FFD700; font-weight:700; letter-spacing:2px;
}

.cand-num {
  position:absolute; top:14px; right:20px;
  font-size:13px; color:rgba(212,175,55,0.6); font-weight:700;
}

.avatar-wrap {
  width:190px; height:190px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  margin:60px auto 16px;
  position:relative;
}
.avatar-wrap::before {
  content:'';
  position:absolute; inset:-4px; border-radius:50%;
  background:conic-gradient(var(--led,#ffffff) 0deg, transparent 55deg, var(--led,#ffffff) 110deg, transparent 165deg, var(--led,#ffffff) 220deg, transparent 275deg, var(--led,#ffffff) 330deg, transparent 360deg);
  animation:led-spin 1.8s linear infinite;
  filter:blur(1px);
}
.avatar-wrap::after {
  content:'';
  position:absolute; inset:-12px; border-radius:50%;
  box-shadow:0 0 22px 8px var(--led,#ffffff), 0 0 50px 18px color-mix(in srgb, var(--led,#ffffff) 35%, transparent);
  animation:led-pulse 1.4s ease-in-out infinite alternate;
}
@keyframes led-spin { to { transform:rotate(360deg); } }
@keyframes led-pulse { from{opacity:0.55} to{opacity:1} }
.avatar-inner {
  width:168px; height:168px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#2a1000,#080200);
  display:flex; align-items:center; justify-content:center;
  font-size:60px; font-weight:900; color:#FFD700;
  position:relative; z-index:1;
  border:2px solid rgba(255,255,255,0.12);
}
.binvirodh {
  margin-top:10px;
  background:linear-gradient(135deg,#003300,#006600,#003300);
  border:2px solid #00ff44;
  border-radius:30px;
  padding:8px 24px;
  font-size:17px; font-weight:900; color:#ccffcc;
  letter-spacing:2px;
  box-shadow:0 0 18px rgba(0,255,60,0.5), 0 0 35px rgba(0,200,40,0.25);
  animation:bv-pulse 1.5s ease-in-out infinite alternate;
}
@keyframes bv-pulse {
  from{box-shadow:0 0 12px rgba(0,255,60,0.4);}
  to{box-shadow:0 0 30px rgba(0,255,60,0.9),0 0 55px rgba(0,200,40,0.4);}
}

.cand-flat {
  font-size:14px; color:#D4AF37; letter-spacing:3px; font-weight:700;
  background:rgba(139,0,0,0.5); padding:5px 20px; border-radius:20px;
  border:1px solid #A07D1C; margin-bottom:8px;
}
.cand-name { font-size:40px; font-weight:900; color:#fff; line-height:1.15; margin:4px 0 10px; text-shadow:0 0 15px rgba(212,175,55,0.3); }
.cand-rule { width:200px; height:2px; background:linear-gradient(90deg,transparent,#D4AF37,transparent); margin:6px auto 14px; }

.info-box {
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(212,175,55,0.3);
  border-radius:14px; padding:16px 20px; width:100%; max-width:400px;
}
.info-row { display:flex; align-items:flex-start; gap:12px; margin:8px 0; text-align:left; }
.info-icon { font-size:20px; flex-shrink:0; }
.info-label { font-size:12px; color:rgba(212,175,55,0.6); font-weight:700; text-transform:uppercase; letter-spacing:1px; min-width:80px; }
.info-val { font-size:17px; color:#f5f5f5; font-weight:600; }
.info-sep { width:100%; height:1px; background:rgba(212,175,55,0.12); margin:4px 0; }

.vote-tag { margin-top:14px; font-size:16px; color:#FFD700; font-weight:700; letter-spacing:2px; }

/* ---- FINAL SLIDE ---- */
.final-slide { background:radial-gradient(ellipse at 50% 25%,#3d0a00 0%,#0d0000 70%); padding:24px; }
.final-cup { font-size:72px; filter:drop-shadow(0 0 25px #D4AF37); animation:pulse 2s infinite; }
.final-name { font-size:32px; font-weight:900; color:#FFD700; margin:10px 0 4px; text-shadow:0 0 20px #D4AF37; }
.final-sym { font-size:15px; color:#D4AF37; letter-spacing:3px; }
.final-div { width:300px; height:2px; background:linear-gradient(90deg,transparent,#D4AF37,transparent); margin:16px auto; }
.final-datebox {
  background:linear-gradient(135deg,rgba(139,0,0,0.8),rgba(92,0,0,0.8));
  border:2px solid #D4AF37; border-radius:20px; padding:20px 30px; margin:10px 0;
  box-shadow:0 0 30px rgba(139,0,0,0.5);
}
.final-dlabel { font-size:13px; color:#D4AF37; letter-spacing:3px; font-weight:700; }
.final-dval { font-size:28px; font-weight:900; color:#fff; margin:6px 0; }
.final-times { display:flex; gap:12px; justify-content:center; margin-top:8px; }
.time-chip { background:rgba(212,175,55,0.15); border:1px solid #A07D1C; border-radius:20px; padding:6px 16px; font-size:15px; color:#FFD700; font-weight:700; }
.final-loc { font-size:14px; color:#f5dfa0; margin:10px 0; line-height:1.6; }
.final-appeal {
  background:linear-gradient(135deg,#A07D1C,#F5D060);
  border-radius:18px; padding:18px 24px; margin:12px 0;
}
.final-appeal-text { font-size:22px; font-weight:900; color:#1a0000; line-height:1.4; }
.final-tag { font-size:18px; font-weight:900; color:#FFD700; letter-spacing:2px; margin-top:14px; text-shadow:0 0 10px #D4AF37; }

/* Controls */
#controls {
  position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
  display:flex; gap:12px; z-index:200;
}
.btn {
  background:rgba(212,175,55,0.15); border:1px solid #D4AF37;
  color:#D4AF37; font-size:13px; padding:8px 18px; border-radius:20px;
  cursor:pointer; font-family:inherit; transition:all 0.2s;
}
.btn:hover { background:rgba(212,175,55,0.3); }

@keyframes pulse { 0%,100%{filter:drop-shadow(0 0 10px #D4AF37)} 50%{filter:drop-shadow(0 0 30px #FFD700)} }
</style>
</head>

        <div class="final-dlabel">📅 मतदानाची तारीख</div>
        <div class="final-dval">रविवार, १२ एप्रिल २०२६</div>
        <div class="final-times">
          <div class="time-chip">⏰ सकाळी ९:०० ते</div>
          <div class="time-chip">दुपारी ३:०० पर्यंत</div>
        </div>
      </div>
      <div class="final-loc">📍 यशराज ग्रीन कॅन्सल, काळेपडळ,<br>हडपसर, पुणे – ४११ ०२८</div>
      <div class="final-appeal">
        <div class="final-appeal-text">सोसायटीच्या विकासासाठी<br><strong>यशराज एकता पॅनल</strong>ला<br>☕ कपबशी चिन्हावर<br>भरभरून मत द्या!</div>
      </div>
      <div class="final-tag">एकतेतून विश्वास • विश्वासातून विकास</div>
    </div>
  `},
];

function candSlide(c, num, total) {
  const color = c.color || '#ffffff';
  const bg = c.bg || 'linear-gradient(160deg,#0d0000 0%,#200500 50%,#0d0000 100%)';
  const catBg = c.catBg || 'linear-gradient(90deg,#1a1a1a,#333,#1a1a1a)';
  const lines = c.n.split('\n');
  const nameHtml = lines.join('<br>');
  const bottomTag = c.binvirodh
    ? `<div class="binvirodh">🏆 बिनविरोध निवड</div>`
    : `<div class="vote-tag" style="color:${color};">☕ कपबशी चिन्हावर मत द्या</div>`;
  return `
    <div class="slide cand-slide show" style="background:${bg}">
      <div class="cand-topbar" style="background:${catBg};color:${color};border-bottom:2px solid ${color}40;">${c.cat}</div>
      <div class="cand-num" style="color:${color}70;">${c.num} / ${total}</div>
      <div class="avatar-wrap" style="--led:${color}">
        <div class="avatar-inner" style="color:${color};">
          <img class="cp" src="assets/img/${c.flat}.png" alt="${c.n}"></div>
      </div>
      <div class="cand-flat" style="color:${color};border-color:${color}50;background:${color}18;">${c.flat}</div>
      <div class="cand-name" style="color:#fff;">${nameHtml}</div>
      <div class="cand-rule" style="background:linear-gradient(90deg,transparent,${color},transparent)"></div>
      <div class="info-box" style="border-color:${color}28;">
        <div class="info-row">
          <span class="info-icon">🎓</span>
          <div>
            <div class="info-label" style="color:${color}80;">शिक्षण</div>
            <div class="info-val">${c.edu}</div>
          </div>
        </div>
        <div class="info-sep" style="background:${color}18;"></div>
        <div class="info-row">
          <span class="info-icon">💼</span>
          <div>
            <div class="info-label" style="color:${color}80;">व्यवसाय</div>
            <div class="info-val">${c.job}</div>
          </div>
        </div>
      </div>
      ${bottomTag}
    </div>
  `;
}

// Render
let cur = 0;
let playing = true;
let timer = null;
const container = document.getElementById('slides');
const prog = document.getElementById('prog');
const ppbtn = document.getElementById('ppbtn');

function show(idx) {
  container.innerHTML = slides[idx].html;
  // progress
  const done = slides.slice(0,idx).reduce((a,s)=>a+s.dur,0);
  const total = slides.reduce((a,s)=>a+s.dur,0);
  prog.style.width = (done/total*100) + '%';
  if (playing) schedule();
}

function schedule() {
  clearTimeout(timer);
  timer = setTimeout(() => {
    if (cur < slides.length-1) { cur++; show(cur); }
    else { playing = false; ppbtn.textContent='▶'; }
  }, slides[cur].dur);
}

function next() {
  clearTimeout(timer);
  if (cur < slides.length-1) { cur++; show(cur); }
}
function prev() {
  clearTimeout(timer);
  if (cur > 0) { cur--; show(cur); }
}
function togglePlay() {
  playing = !playing;
  ppbtn.textContent = playing ? '⏸' : '▶';
  if (playing) schedule(); else clearTimeout(timer);
}

show(0);
</script>
</body>
